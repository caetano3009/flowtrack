<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlowTrack — Preview</title>
<style>
  :root {
    --primary: #1E3A5F;
    --secondary: #2563EB;
    --accent-light: #BFDBFE;
    --bg: #F4F5F7;
    --card: #FFFFFF;
    --track: #E7E9EE;
    --gold: #B45309;
    --text: #1E293B;
    --text-muted: #64748B;
    --alert-bg: #FDEBD3;
    --alert-text: #9C4B0E;
    --inactive: #94A3B8;
    --active: #15803D;
    --border: #E2E5EA;
  }
  :root[data-theme="dark"] {
    --primary: #3B82F6;
    --secondary: #60A5FA;
    --accent-light: #1E3A5F;
    --bg: #0F172A;
    --card: #1E293B;
    --track: #334155;
    --gold: #D97706;
    --text: #E2E8F0;
    --text-muted: #94A3B8;
    --alert-bg: #3A2B12;
    --alert-text: #F0A93E;
    --inactive: #64748B;
    --active: #4ADE80;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #d8dbe0;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
    transition: background 0.2s;
  }
  :root[data-theme="dark"] body { background: #05070d; }
  .phone {
    width: 380px;
    max-width: 100%;
    background: var(--bg);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    border: 8px solid #111;
    display: flex;
    flex-direction: column;
    min-height: 800px;
    transition: background 0.2s;
  }
  .screen { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
  .topbar {
    background: var(--primary);
    color: white;
    padding: 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .topbar .left { display: flex; align-items: center; gap: 8px; }
  .topbar .title { font-weight: 700; font-size: 16px; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: white; background: transparent; border: none;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.15); }
  .topbar-actions { display: flex; align-items: center; gap: 2px; }
  .content { padding: 16px; flex: 1; }
  .bottom-nav { display: flex; background: var(--card); border-top: 1px solid var(--border); flex-shrink: 0; }
  .bottom-nav .item {
    flex: 1; text-align: center; padding: 8px 4px 10px; font-size: 10.5px; color: var(--text-muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  .bottom-nav .item.active { color: var(--secondary); font-weight: 700; }
  .bottom-nav .item svg { stroke: var(--text-muted); }
  .bottom-nav .item.active svg { stroke: var(--secondary); }

  /* LOGIN */
  .login-wrap { background: var(--primary); flex: 1; display: flex; flex-direction: column; align-items: center; padding: 44px 24px 24px; position: relative; }
  .login-theme-toggle { position: absolute; top: 12px; right: 12px; }
  .login-logo { color: white; }
  .login-title { color: white; font-weight: 700; font-size: 24px; margin: 8px 0 0; }
  .login-sub { color: rgba(255,255,255,0.7); font-size: 10.5px; letter-spacing: 1px; margin-bottom: 28px; text-align: center; }
  .login-card { background: var(--bg); border-radius: 16px; padding: 20px; width: 100%; }
  .login-card h3 { text-align: center; margin: 0 0 16px; font-size: 15px; color: var(--text); }
  .role-toggle { display: flex; background: var(--card); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .role-toggle button { flex: 1; border: none; background: transparent; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 13px; color: var(--text-muted); cursor: pointer; }
  .role-toggle button.active { background: var(--primary); color: white; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 14px; font-family: inherit; background: var(--card); color: var(--text);
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .btn-primary {
    width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--primary);
    color: white; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  .btn-primary:disabled { background: var(--inactive); cursor: not-allowed; }
  .btn-primary:hover:not(:disabled) { background: var(--secondary); }
  .hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 10px; }

  .stat-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .stat-card { flex: 1; background: var(--card); border-radius: 12px; padding: 14px; }
  .stat-card .label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
  .stat-card .value { font-size: 22px; font-weight: 700; color: var(--secondary); }
  .stat-card .value.gold { color: var(--gold); }
  .greeting-eyebrow { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .greeting-name { font-size: 20px; font-weight: 700; margin: 0 0 14px; color: var(--text); }
  .section-title { font-size: 14px; font-weight: 700; margin: 14px 0 8px; display: flex; justify-content: space-between; align-items: center; color: var(--text); gap: 6px; }
  .section-title .link { font-size: 12px; font-weight: 500; color: var(--secondary); cursor: pointer; margin-left: auto; }
  .alert-row { border-radius: 10px; padding: 12px 14px; font-size: 12.5px; margin-bottom: 8px; background: var(--card); color: var(--text); }
  .alert-row.warn { background: var(--alert-bg); color: var(--alert-text); }
  .record-row {
    display: flex; justify-content: space-between; align-items: center; background: var(--card);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .record-row .name { font-weight: 700; font-size: 13.5px; color: var(--text); }
  .record-row .meta { font-size: 11.5px; color: var(--text-muted); }
  .pill { background: var(--accent-light); border-radius: 20px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; color: var(--text); }
  .quick-actions { display: flex; gap: 10px; margin-top: 6px; }
  .quick-actions button {
    flex: 1; padding: 11px 6px; border-radius: 10px; border: none; background: var(--primary);
    color: white; font-size: 11.5px; font-weight: 700; cursor: pointer;
  }

  .member-count-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .member-count-row span { font-size: 12.5px; color: var(--text-muted); }
  .btn-small { padding: 9px 14px; border-radius: 8px; border: none; background: var(--primary); color: white; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .member-card { background: var(--card); border-radius: 10px; padding: 14px; display: flex; justify-content: space-between; margin-bottom: 10px; }
  .member-card .name { font-weight: 700; font-size: 14.5px; color: var(--text); }
  .member-card .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .badge { border-radius: 20px; padding: 3px 10px; font-size: 10.5px; font-weight: 700; display: inline-block; }
  .badge.active { background: rgba(21,128,61,0.15); color: var(--active); }
  .badge.inactive { background: rgba(148,163,184,0.25); color: var(--text-muted); }
  .checkin-count { font-size: 11px; font-weight: 700; color: var(--secondary); margin-top: 6px; }

  .total-card { background: var(--gold); color: white; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; margin-bottom: 12px; }
  .total-card .eyebrow { font-size: 10.5px; opacity: 0.85; }
  .total-card .big { font-size: 22px; font-weight: 700; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 7px 14px; border-radius: 20px; font-size: 12px; background: var(--card); color: var(--text); cursor: pointer; }
  .chip.active { background: var(--primary); color: white; }

  .shift-option { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 8px; cursor: pointer; }
  .shift-option:hover { outline: 2px solid var(--accent-light); }
  .shift-option .t { font-weight: 700; font-size: 14px; color: var(--text); }
  .shift-option .s { font-size: 11.5px; color: var(--text-muted); }
  .chip-select { padding: 8px 14px; border-radius: 20px; font-size: 12px; background: var(--card); color: var(--text); cursor: pointer; margin: 0 8px 8px 0; display: inline-block; }
  .chip-select.active { background: var(--primary); color: white; }

  .confirm-box { text-align: center; padding-top: 20px; }
  .confirm-circle { width: 68px; height: 68px; border-radius: 50%; background: var(--accent-light); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .confirm-circle svg { stroke: var(--primary); }
  .summary-box { background: var(--card); border-radius: 10px; padding: 14px; text-align: left; margin: 16px 0; }
  .summary-box .eyebrow { font-size: 10.5px; color: var(--text-muted); margin-bottom: 6px; }
  .summary-box div.row { font-size: 13px; margin-bottom: 2px; color: var(--text); }

  .action-row { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 10px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer; }
  .action-row:hover { outline: 2px solid var(--accent-light); }
  .action-row svg { stroke: var(--secondary); flex-shrink: 0; }
  .action-row .t { font-weight: 700; font-size: 13.5px; color: var(--text); }
  .action-row .s { font-size: 11.5px; color: var(--text-muted); }

  .next-shift { background: var(--primary); border-radius: 14px; padding: 16px; color: white; margin-bottom: 16px; }
  .next-shift .eyebrow { font-size: 10.5px; opacity: 0.7; }
  .next-shift .t { font-weight: 700; font-size: 16px; margin: 2px 0; }
  .next-shift .s { font-size: 11.5px; opacity: 0.85; }
  .next-shift button { margin-top: 10px; background: var(--secondary); color: white; border: none; border-radius: 8px; padding: 9px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  .error-text { color: #DC5C5C; font-size: 12px; margin-top: 4px; }

  /* CHARTS */
  .chart-card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .chart-card .chart-title { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 14px; }
  .bar-row { display: flex; align-items: center; margin-bottom: 8px; }
  .bar-label { width: 96px; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .bar-track { flex: 1; height: 16px; background: var(--track); border-radius: 4px; overflow: hidden; margin: 0 8px; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
  .bar-value { width: 26px; font-size: 12px; font-weight: 700; color: var(--text); text-align: right; }
  .empty-note { font-size: 12px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen"></div>
</div>

<script>
// ---------- lightweight line-icon set (no external libraries) ----------
function icon(name, size = 18) {
  const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;
  const paths = {
    insights: `<path d="M3 3v18h18"/><path d="M7 15l4-6 4 3 5-8"/>`,
    dashboard: `<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>`,
    team: `<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15 20c0-2.6 1-4.7 3-5.6"/>`,
    chart: `<path d="M4 20V10M12 20V4M20 20v-7"/><path d="M2 20h20"/>`,
    history: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>`,
    check: `<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>`,
    assignment: `<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4"/>`,
    home: `<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V10"/>`,
    calendar: `<rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>`,
    package: `<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>`,
    warning: `<path d="M12 3 22 20H2L12 3z"/><path d="M12 10v4M12 17h.01"/>`,
    back: `<path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/>`,
    logout: `<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>`,
    sun: `<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>`,
    moon: `<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z"/>`,
    personAdd: `<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M18 8v6M15 11h6"/>`
  };
  return `<svg ${s}>${paths[name] || ""}</svg>`;
}

// ---------- in-memory "database" ----------
let members = [
  { id: 1, name: "Marina Souza", contact: "(11) 98765-0001", schedule: "Seg, Qua", active: true, checkinCount: 12 },
  { id: 2, name: "Pedro Almeida", contact: "(11) 98765-0002", schedule: "Ter, Qui", active: true, checkinCount: 8 },
  { id: 3, name: "Rafael Costa", contact: "(11) 98765-0003", schedule: "Sex", active: true, checkinCount: 15 },
  { id: 4, name: "Juliana Nunes", contact: "(11) 98765-0004", schedule: "Sáb", active: false, checkinCount: 3 },
];
let records = [
  { item: "Peças montadas", qty: 120, unit: "unidades", who: "Marina S.", date: "05/05/2025" },
  { item: "Atendimentos realizados", qty: 34, unit: "unidades", who: "Pedro A.", date: "04/05/2025" },
  { item: "Horas em campo", qty: 22, unit: "horas", who: "Rafael C.", date: "03/05/2025" },
  { item: "Produtos embalados", qty: 340, unit: "unidades", who: "Marina S.", date: "02/05/2025" },
  { item: "Chamados resolvidos", qty: 15, unit: "unidades", who: "Juliana N.", date: "01/05/2025" },
  { item: "Metros instalados", qty: 60, unit: "m", who: "Pedro A.", date: "30/04/2025" },
  { item: "Peças montadas", qty: 90, unit: "unidades", who: "Rafael C.", date: "29/04/2025" },
];
let checkins = [];

let session = { role: null, name: "" };
let ui = {
  screen: "login",
  isManagerTab: true,
  historyFilter: "Todos",
  shiftConfirmed: false,
  chosenShift: "",
  recordSaved: false,
  itemName: "",
  selectedUnit: "unidades",
  customUnit: "",
  qty: "",
  darkMode: false,
};

const UNITS = ["unidades", "kg", "horas", "litros", "m", "m²", "peças", "atendimentos", "Outro"];

function todayBR() {
  const d = new Date();
  return String(d.getDate()).padStart(2,'0') + "/" + String(d.getMonth()+1).padStart(2,'0') + "/" + d.getFullYear();
}

function nav(screen) { ui.screen = screen; render(); }
function logout() { session = { role: null, name: "" }; ui.screen = "login"; render(); }
function toggleDark() { ui.darkMode = !ui.darkMode; document.documentElement.setAttribute("data-theme", ui.darkMode ? "dark" : "light"); render(); }

function render() {
  const target = document.getElementById("screen");
  target.innerHTML = "";
  const map = {
    login: renderLogin,
    manager_dashboard: renderManagerDashboard,
    manager_members: renderManagerMembers,
    manager_add_member: renderAddMember,
    manager_charts: renderManagerCharts,
    manager_history: renderManagerHistory,
    member_home: renderMemberHome,
    member_checkin: renderCheckIn,
    member_production: renderProduction,
    member_history: renderMemberHistory,
  };
  target.appendChild(map[ui.screen]());
}

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

function topBar(title, opts = {}) {
  const left = el("div", { class: "left" }, [
    opts.onBack
      ? el("button", { class: "icon-btn", onclick: opts.onBack, html: icon("back") })
      : el("span", { style: "display:flex;align-items:center;color:white", html: icon("insights") }),
    el("span", { class: "title" }, title),
  ]);
  const actions = el("div", { class: "topbar-actions" }, [
    el("button", { class: "icon-btn", onclick: toggleDark, html: icon(ui.darkMode ? "sun" : "moon") }),
    el("button", { class: "icon-btn", onclick: logout, html: icon("logout") }),
  ]);
  return el("div", { class: "topbar" }, [left, actions]);
}

function bottomNav(items, active) {
  return el("div", { class: "bottom-nav" }, items.map(([route, label, iconName]) =>
    el("div", { class: "item" + (route === active ? " active" : ""), onclick: () => nav(route) }, [
      el("span", { html: icon(iconName, 20) }),
      el("span", {}, label),
    ])
  ));
}

const MANAGER_NAV = [
  ["manager_dashboard", "Painel", "dashboard"],
  ["manager_members", "Equipe", "team"],
  ["manager_charts", "Gráficos", "chart"],
  ["manager_history", "Histórico", "history"],
];
const MEMBER_NAV = [
  ["member_home", "Início", "home"],
  ["member_checkin", "Presença", "check"],
  ["member_production", "Registro", "assignment"],
  ["member_history", "Histórico", "history"],
];

// ---------- LOGIN ----------
function renderLogin() {
  let username = "", password = "";
  const wrap = el("div", { class: "login-wrap" });
  wrap.appendChild(el("button", { class: "icon-btn login-theme-toggle", onclick: toggleDark, html: icon(ui.darkMode ? "sun" : "moon") }));
  wrap.appendChild(el("div", { class: "login-logo", html: icon("insights", 36) }));
  wrap.appendChild(el("div", { class: "login-title" }, "FlowTrack"));
  wrap.appendChild(el("div", { class: "login-sub" }, "GESTÃO DE EQUIPES E PRODUÇÃO"));

  const card = el("div", { class: "login-card" });
  card.appendChild(el("h3", {}, "Acesse sua conta"));

  const toggle = el("div", { class: "role-toggle" });
  const managerBtn = el("button", { class: ui.isManagerTab ? "active" : "" }, "Gestor");
  const memberBtn = el("button", { class: !ui.isManagerTab ? "active" : "" }, "Colaborador");
  managerBtn.onclick = () => { ui.isManagerTab = true; render(); };
  memberBtn.onclick = () => { ui.isManagerTab = false; render(); };
  toggle.appendChild(managerBtn); toggle.appendChild(memberBtn);
  card.appendChild(toggle);

  const userField = el("div", { class: "field" });
  userField.appendChild(el("label", {}, ui.isManagerTab ? "Usuário" : "Nome"));
  userField.appendChild(el("input", { type: "text", placeholder: ui.isManagerTab ? "gestor" : "marina", oninput: (e) => username = e.target.value }));
  card.appendChild(userField);

  const passField = el("div", { class: "field" });
  passField.appendChild(el("label", {}, "Senha"));
  passField.appendChild(el("input", { type: "password", placeholder: "••••", oninput: (e) => password = e.target.value }));
  card.appendChild(passField);

  card.appendChild(el("button", {
    class: "btn-primary", onclick: () => {
      if (ui.isManagerTab) {
        session = { role: "manager", name: username.trim() || "Gestor" };
        nav("manager_dashboard");
      } else {
        const typed = (username.trim() || "Marina");
        const found = members.find(m => m.name.toLowerCase().includes(typed.toLowerCase()));
        session = { role: "member", name: found ? found.name : typed };
        nav("member_home");
      }
    }
  }, "Entrar"));

  card.appendChild(el("div", { class: "hint" }, ui.isManagerTab ? "Gestor: qualquer usuário/senha (demo)" : "Colaborador: digite um nome já cadastrado (demo)"));
  wrap.appendChild(card);
  return wrap;
}

// ---------- MANAGER DASHBOARD ----------
function renderManagerDashboard() {
  const frag = el("div", {});
  frag.appendChild(topBar("FlowTrack"));
  const c = el("div", { class: "content" });

  c.appendChild(el("div", { class: "greeting-eyebrow" }, "Bom dia,"));
  c.appendChild(el("div", { class: "greeting-name" }, session.name));

  const activeCount = members.filter(m => m.active).length;
  c.appendChild(el("div", { class: "stat-row" }, [
    el("div", { class: "stat-card" }, [el("div", { class: "label" }, "Colaboradores Ativos"), el("div", { class: "value" }, String(activeCount))]),
    el("div", { class: "stat-card" }, [el("div", { class: "label" }, "Registros no total"), el("div", { class: "value gold" }, String(records.length))]),
  ]));

  const todayCount = checkins.filter(a => a.date === todayBR()).length;
  c.appendChild(el("div", { class: "stat-card", style: "margin-bottom:12px" }, [el("div", { class: "label" }, "Check-ins hoje"), el("div", { class: "value" }, String(todayCount))]));

  c.appendChild(el("div", { class: "section-title" }, [el("span", { html: icon("warning", 16) }), document.createTextNode("Alertas")]));

  c.appendChild(el("div", { class: "section-title" }, [
    document.createTextNode("Registros Recentes"),

  qa.appendChild(el("button", { onclick: () => nav("manager_history") }, "Ver Histórico"));

  frag.appendChild(c);

function recordRow(r) {

// ---------- ADD MEMBER ----------
function renderAddMember() {
  const frag = el("div", {});

  const c = el("div", { class: "content" });

  let form = { name: "", contact: "", schedule: "", notes: "" };

    const wrap = el("div", { class: "field" });

    const input = el(isArea ? "textarea" : "input", { placeholder, oninput: (e) => { form[key] = e.target.value; saveBtn.disabled = !form.name.trim(); } });

  }

  c.appendChild(field("Contato", "Telefone, e-mail ou WhatsApp", "contact"));
  c.appendChild(field("Dias / turno disponível", "Ex: Segunda, Quarta - Manhã", "schedule"));
  c.appendChild(field("Observações", "Função, habilidades, restrições...", "notes", true));

  const saveBtn = el("button", { class: "btn-primary", disabled: true, onclick: () => {
    members.push({ id: members.length + 1, name: form.name.trim(), contact: form.contact.trim(), schedule: form.schedule.trim(), active: true, checkinCount: 0 });
    nav("manager_members");
  }}, "Salvar Colaborador");
  c.appendChild(saveBtn);

  frag.appendChild(c);
  return frag;
}

// ---------- MANAGER CHARTS ----------
function groupCount(list, keyFn) {
  const map = {};
  list.forEach(x => { const k = keyFn(x); map[k] = (map[k] || 0) + 1; });
  return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, 6);
}

function barChart(title, data) {
  const card = el("div", { class: "chart-card" });
  card.appendChild(el("div", { class: "chart-title" }, title));
  if (data.length === 0) {
    card.appendChild(el("div", { class: "empty-note" }, "Sem dados suficientes ainda."));
    return card;
  }
  const max = Math.max(...data.map(d => d[1]), 1);
  data.forEach(([label, value]) => {
    const row = el("div", { class: "bar-row" });
    row.appendChild(el("div", { class: "bar-label" }, label));
    const track = el("div", { class: "bar-track" });
    track.appendChild(el("div", { class: "bar-fill", style: `width:${(value / max) * 100}%;background:var(--secondary)` }));
    row.appendChild(track);
    row.appendChild(el("div", { class: "bar-value" }, String(value)));
    card.appendChild(row);
  });
  return card;
}

function renderManagerCharts() {
  const frag = el("div", {});
  frag.appendChild(topBar("Gráficos"));
  const c = el("div", { class: "content" });

  c.appendChild(el("div", { style: "font-weight:700;font-size:17px;color:var(--text);margin-bottom:12px" }, "Visão Geral"));

  c.appendChild(el("div", { class: "stat-row" }, [

    el("div", { class: "stat-card" }, [el("div", { class: "label" }, "Registros"), el("div", { class: "value gold" }, String(records.length))]),
    el("div", { class: "stat-card" }, [el("div", { class: "label" }, "Check-ins"), el("div", { class: "value" }, String(checkins.length))]),
  ]));

  c.appendChild(barChart("Registros por item", groupCount(records, r => r.item)));
  c.appendChild(barChart("Registros por colaborador", groupCount(records, r => r.who)));
  c.appendChild(barChart("Check-ins por colaborador", groupCount(checkins, ck => ck.memberName)));

  frag.appendChild(c);
  frag.appendChild(bottomNav(MANAGER_NAV, "manager_charts"));
  return frag;
}

// ---------- CHECK-IN ----------
function renderCheckIn() {
  const frag = el("div", {});
  frag.appendChild(topBar("Registrar Presença", { onBack: () => { ui.shiftConfirmed = false; nav("member_home"); } }));
  const c = el("div", { class: "content" });

  if (!ui.shiftConfirmed) {
    c.appendChild(el("div", { class: "summary-box" }, [
      el("div", { class: "eyebrow" }, "Data de hoje"),
      el("div", { style: "font-weight:700;font-size:16px;color:var(--text)" }, todayBR()),
    ]));
    c.appendChild(el("div", { class: "section-title" }, "Selecione o turno:"));
    [["Manhã","07h00 – 11h00"], ["Tarde","13h00 – 17h00"], ["Integral","07h00 – 17h00"]].forEach(([label, time]) => {
      c.appendChild(el("div", { class: "shift-option", onclick: () => {
        ui.chosenShift = label;
        checkins.push({ memberName: session.name, date: todayBR(), shift: label });
        ui.shiftConfirmed = true;

      }}, [el("div", { class: "t" }, label), el("div", { class: "s" }, time)]));

    box.appendChild(el("div", { class: "confirm-circle", html: icon("check", 32) }));
    box.appendChild(el("div", { style: "font-weight:700;font-size:18px;color:var(--text)" }, "Presença Registrada"));
    box.appendChild(el("div", { style: "font-size:13px;color:var(--text-muted)" }, "Seu check-in foi salvo com sucesso."));
    box.appendChild(el("div", { class: "summary-box" }, [
      el("div", { class: "eyebrow" }, "RESUMO DO REGISTRO"),
      el("div", { class: "row" }, "Colaborador(a): " + session.name),
      el("div", { class: "row" }, "Turno: " + ui.chosenShift),
      el("div", { class: "row" }, "Data: " + todayBR()),
    ]));
    box.appendChild(el("button", { class: "btn-primary", onclick: () => { ui.shiftConfirmed = false; nav("member_home"); } }, "Concluir"));
    c.appendChild(box);
  }

  frag.appendChild(c);
  return frag;
}

// ---------- PRODUCTION RECORD ----------
function renderProduction() {
  const frag = el("div", {});
  frag.appendChild(topBar("Lançar Registro", { onBack: () => { ui.recordSaved = false; nav("member_home"); } }));
  const c = el("div", { class: "content" });

  if (!ui.recordSaved) {
    c.appendChild(el("div", { style: "font-weight:700;font-size:17px;color:var(--text)" }, "Registro de Produção"));
    c.appendChild(el("div", { style: "font-size:12px;color:var(--text-muted);margin-bottom:14px" }, "Descreva o que foi feito ou produzido hoje."));

    c.appendChild(el("label", { style: "font-size:13px;font-weight:700;color:var(--text)" }, "O que foi feito / produzido? *"));
    const itemField = el("div", { class: "field", style: "margin-top:6px" });
    const itemInput = el("input", { type: "text", placeholder: "Ex: Peças montadas, Atendimentos, Relatórios...", value: ui.itemName, oninput: (e) => { ui.itemName = e.target.value; validate(); } });
    itemField.appendChild(itemInput);
    c.appendChild(itemField);

    c.appendChild(el("label", { style: "font-size:13px;font-weight:700;color:var(--text)" }, "Unidade *"));
    const unitWrap = el("div", { style: "margin:8px 0 0" });
    UNITS.forEach(u => {
      unitWrap.appendChild(el("span", { class: "chip-select" + (u === ui.selectedUnit ? " active" : ""), onclick: () => { ui.selectedUnit = u; render(); } }, u));
    });
    c.appendChild(unitWrap);

    if (ui.selectedUnit === "Outro") {
      const customField = el("div", { class: "field", style: "margin-top:8px" });
      customField.appendChild(el("input", { type: "text", placeholder: "Digite a unidade (ex: caixas, viagens...)", value: ui.customUnit, oninput: (e) => { ui.customUnit = e.target.value; validate(); } }));
      c.appendChild(customField);
    }

    const qtyField = el("div", { class: "field", style: "margin-top:14px" });
    qtyField.appendChild(el("label", {}, "Quantidade *"));
    const qtyInput = el("input", { type: "number", placeholder: "Ex: 12", value: ui.qty, oninput: (e) => { ui.qty = e.target.value; validate(); } });
    qtyField.appendChild(qtyInput);
    const errorText = el("div", { class: "error-text" }, "");
    qtyField.appendChild(errorText);
    c.appendChild(qtyField);

    let notes = "";
    const notesField = el("div", { class: "field" });
    notesField.appendChild(el("label", {}, "Observações"));
    notesField.appendChild(el("textarea", { placeholder: "Detalhes, condições, ocorrências...", oninput: (e) => notes = e.target.value }));
    c.appendChild(notesField);

    function finalUnit() { return ui.selectedUnit === "Outro" ? ui.customUnit.trim() : ui.selectedUnit; }
    function isValid() { return ui.itemName.trim() && parseFloat(ui.qty) > 0 && finalUnit(); }
    function validate() { saveBtn.disabled = !isValid(); errorText.textContent = ""; }

    const saveBtn = el("button", { class: "btn-primary", disabled: !isValid(), onclick: () => {
      if (!isValid()) { errorText.textContent = "Preencha item, unidade e quantidade válida."; return; }
      records.unshift({ item: ui.itemName.trim(), qty: parseFloat(ui.qty), unit: finalUnit(), who: session.name, date: todayBR() });
      ui.recordSaved = true;
      render();
    }}, "Salvar Registro");
    c.appendChild(saveBtn);
  } else {
    const finalUnitVal = ui.selectedUnit === "Outro" ? ui.customUnit.trim() : ui.selectedUnit;
    const box = el("div", { class: "confirm-box" });
    box.appendChild(el("div", { class: "confirm-circle", html: icon("package", 30) }));
    box.appendChild(el("div", { style: "font-weight:700;font-size:18px;color:var(--text)" }, "Registro Salvo"));
    box.appendChild(el("div", { style: "font-size:13px;color:var(--text-muted)" }, "Dados salvos com sucesso."));
    box.appendChild(el("div", { class: "summary-box" }, [
      el("div", { class: "eyebrow" }, "RESUMO"),
      el("div", { class: "row" }, "Item: " + ui.itemName),
      el("div", { class: "row" }, "Quantidade: " + ui.qty + " " + finalUnitVal),
      el("div", { class: "row" }, "Data: " + todayBR()),
    ]));
    box.appendChild(el("button", { class: "btn-primary", onclick: () => {
      ui.recordSaved = false; ui.itemName = ""; ui.qty = ""; ui.selectedUnit = "unidades"; ui.customUnit = ""; nav("member_home");
    }}, "Novo Registro"));
    c.appendChild(box);
  }

  frag.appendChild(c);
  return frag;
}

// ---------- MEMBER HISTORY ----------
function renderMemberHistory() {
  const frag = el("div", {});
  frag.appendChild(topBar("Meu Histórico"));
  const c = el("div", { class: "content" });

  const myCheckins = checkins.filter(a => a.memberName === session.name);
  const myRecords = records.filter(r => r.who === session.name || r.who.startsWith(session.name.split(" ")[0]));

  c.appendChild(el("div", { style: "font-weight:700;font-size:15px;color:var(--text)" }, "Presenças (" + myCheckins.length + ")"));
  const list = el("div", { style: "margin:8px 0 16px" });
  if (myCheckins.length === 0) {
    list.appendChild(el("div", { style: "font-size:13px;color:var(--text-muted)" }, "Nenhuma presença registrada ainda."));
  } else {
    myCheckins.slice().reverse().slice(0,5).forEach(a => {
      list.appendChild(el("div", { style: "font-size:13px;color:var(--text-muted);margin-bottom:2px" }, a.date + " — " + a.shift));
    });
  }
  c.appendChild(list);

  c.appendChild(el("div", { style: "font-weight:700;font-size:15px;margin-bottom:8px;color:var(--text)" }, "Registros (" + myRecords.length + ")"));
  if (myRecords.length === 0) {
    c.appendChild(el("div", { style: "font-size:13px;color:var(--text-muted)" }, "Nenhum registro ainda."));
  } else {
    myRecords.forEach(r => c.appendChild(recordRow(r)));
  }

  frag.appendChild(c);
  frag.appendChild(bottomNav(MEMBER_NAV, "member_history"));
  return frag;
}

render();
